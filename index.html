<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Great British Boys' Comic Archive</title><meta name="description" content="Step into a 1970s British newsagent and explore the comics."><style>*{box-sizing:border-box}body{margin:0;background:#26170e;color:#fff2c8;font-family:Georgia,serif}header{padding:12px;text-align:center;font-size:14px}header strong{color:#ffda51}#viewport{overflow:hidden;width:100%;display:flex;justify-content:center}#scene{position:relative;width:min(100vw,calc((100dvh - 112px)*1672/941),1672px);aspect-ratio:1672/941;flex:none;background:#28180e}#scene img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.hotspot{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;border-radius:8px;width:8.5%;height:19%}.hotspot.small{width:4.3%;height:10%}.hotspot:focus-visible,.hotspot:hover{outline:4px dashed #fff200;background:#fff20044}.zone{position:absolute;cursor:pointer;border:0;background:transparent}.zone:hover,.zone:focus-visible{outline:4px dashed #ffeb3b;background:#ffdb002c}dialog{border:8px ridge #8e4a23;background:#f6e4b6;color:#241910;max-width:550px;width:92%;box-shadow:12px 14px #160d08;padding:22px}dialog::backdrop{background:#000b}dialog h2{font:900 2rem system-ui,sans-serif;color:#af2617}button{font:inherit}#close{float:right;border:2px solid #241910;background:#bd2719;color:white;padding:7px 12px;cursor:pointer}.list{display:flex;flex-wrap:wrap;gap:7px}.list button{background:#f5c63e;border:2px solid #322319;padding:7px;cursor:pointer}footer{text-align:center;padding:8px}footer button{background:#f5c63e;border:2px solid #322319;padding:9px 15px;cursor:pointer}@media(min-width:1700px){#scene{max-width:1672px;margin:auto}}@media(max-width:950px){header{font-size:13px}}</style></head><body><header><strong>STEP INSIDE THE NEWSAGENT!</strong> Click a comic cover or a department sign. On mobile, swipe sideways to explore the shelves.</header><div id="viewport"><main id="scene"><img src="newsagent-web.jpg" alt="Illustrated 1970s British newsagent with The Main Event comics on the back wall, Almost Made It and Mixed Bag on the left, and Honourable Mentions on the right."></main></div><footer><a href="fleetway.html" style="display:inline-block;background:#b6291e;color:#fff4cb;padding:9px 15px;margin-right:8px;font-weight:bold;text-decoration:none;border:2px solid #e9c451">ENTER THE IPC / FLEETWAY ARCHIVE</a><button id="browse">Browse the full comic directory</button></footer><dialog id="panel"><button id="close">CLOSE ✕</button><h2 id="heading"></h2><p id="description"></p><div class="list" id="list"></div></dialog><script>const main=[["The Beano",28.1,40.5],["The Dandy",37.3,40.5],["The Beezer",47.2,40.5],["The Topper",56.7,40.5],["Buster",65.3,40.5],["Sparky",74.4,40.5],["Whizzer and Chips",28.1,58.6],["Cor!!",37.3,58.6],["Knockout",47.2,58.6],["Buzz",56.7,58.6],["Shiver and Shake",65.3,58.6],["Whoopee!",74.4,58.6],["Cracker",28.1,73.5],["Monster Fun",37.3,73.5],["Krazy",47.2,73.5],["Cheeky Weekly",56.7,73.5],["Plug",65.3,73.5],["Jackpot",74.4,73.5]],extra=[["Smash!",7.2,53],["TV Comic",15.1,53],["Lion",4.3,76.5],["Valiant",8.8,76.5],["Scorcher",13.4,76.5],["Victor",17.6,76.5],["Battle",4.3,86],["2000 AD",8.8,86],["Hotspur",13.4,86],["Hornet",17.6,86],["Bunty",86.5,57.8],["Judy",91.2,57.8],["Mandy",95.8,57.8],["Misty",86.5,69.3],["Twinkle",91.2,69.3],["Playhour",95.8,69.3],["Jackie",86.5,80],["Viz",91.2,80],["Oz",95.8,80]],directory={"THE MAIN EVENT":["The Beano","The Dandy","The Beezer","The Topper","Sparky","Buzz","Cracker","Plug","Buster","Whizzer and Chips","Cor!!","Knockout","Shiver and Shake","Whoopee!","Monster Fun","Krazy","Cheeky Weekly","Jackpot"],"ALMOST MADE IT!":["Smash!","TV Comic"],"THE MIXED BAG":["Lion","Valiant","Thunder","Jet","Scorcher","Score 'n' Roar","Vulcan","Battle Picture Weekly","Action","2000 AD","Roy of the Rovers","Hornet","Hotspur","Victor","Wizard","Bullet","Look-in","TV Century 21","Countdown","Star Wars Weekly"],"HONOURABLE MENTIONS":["Bunty","Judy","Mandy","Diana","June","Princess Tina","Tammy","Sandie","Pixie","Jinty","Lindy","Misty","Penny","Spellbound","Twinkle","Pippin","Bimbo","Goofy","Hey Diddle Diddle","Bonnie","Toby","See-Saw","Bobo Bunny","Playhour","Jack and Jill","Teddy Bear","Playland","Seven","Esmeralda","Fun-to-Do","Fun-to-Know","Viz","Nasty Tales","Cyclops","Oz","International Times","Jackie","Pink","Oh Boy!","Blue Jeans"]};const scene=document.getElementById('scene'),panel=document.getElementById('panel'),heading=document.getElementById('heading'),description=document.getElementById('description'),list=document.getElementById('list');function show(name,section){if(!section&&["Buster","Whizzer and Chips","Cor!!","Knockout","Shiver and Shake","Whoopee!","Monster Fun","Krazy","Cheeky Weekly","Jackpot","Jet"].includes(name)){location.href="fleetway.html#comic="+encodeURIComponent(name);return;}heading.textContent=name;description.textContent=section?'Browse the comics in this department. Select a title to explore it.':'This comic is in the archive. Detailed issue records, artists and strips are being researched.';list.replaceChildren();if(section){for(const title of directory[section]){const b=document.createElement('button');b.textContent=title;b.onclick=()=>show(title);list.append(b)}}if(!panel.open)panel.showModal()}function hotspot(name,x,y,small){const b=document.createElement('button');b.className='hotspot'+(small?' small':'');b.style.left=x+'%';b.style.top=y+'%';b.title=name;b.setAttribute('aria-label','Explore '+name);b.onclick=()=>show(name);b.style.zIndex='2';scene.append(b)}for(const [n,x,y] of main)hotspot(n,x,y,false);for(const [n,x,y] of extra)hotspot(n,x,y,true);const zones=[['THE MAIN EVENT',29,21,50,8],['ALMOST MADE IT!',3,33,16,11],['THE MIXED BAG',3,62,16,9],['HONOURABLE MENTIONS',84,36,14,15]];for(const [name,x,y,w,h] of zones){const b=document.createElement('button');b.className='zone';Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});b.title='Browse '+name;b.setAttribute('aria-label','Browse '+name);b.onclick=()=>show(name,true);b.style.zIndex='3';scene.append(b)}document.getElementById('close').onclick=()=>panel.close();document.getElementById('browse').onclick=()=>{heading.textContent='THE COMPLETE COMIC DIRECTORY';description.textContent='Choose a department.';list.replaceChildren();for(const k of Object.keys(directory)){const b=document.createElement('button');b.textContent=k;b.onclick=()=>show(k,true);list.append(b)}if(!panel.open)panel.showModal()};
// The whole illustration is clickable, including areas between the invisible cover buttons.
scene.addEventListener('click',e=>{
 if(e.target.closest('button'))return;
 const r=scene.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;
 if(y<30&&x>20&&x<81){show('THE MAIN EVENT',true);return}
 if(x<21){show(y<62?'ALMOST MADE IT!':'THE MIXED BAG',true);return}
 if(x>83){show('HONOURABLE MENTIONS',true);return}
 const nearest=main.map(([n,cx,cy])=>({n,d:Math.hypot(x-cx,(y-cy)*0.85)})).sort((a,b)=>a.d-b.d)[0];
 if(nearest.d<10)show(nearest.n);else show('THE MAIN EVENT',true);
});
</script></body></html>
