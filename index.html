<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Great British Boys' Comic Archive</title><meta name="description" content="Step into a 1970s British newsagent and explore the comics."><style>*{box-sizing:border-box}body{margin:0;background:#26170e;color:#fff2c8;font-family:Georgia,serif}header{padding:12px;text-align:center;font-size:14px}header strong{color:#ffda51}#viewport{overflow:auto;max-width:100vw;touch-action:pan-x pan-y}#scene{position:relative;width:100%;min-width:950px;aspect-ratio:1672/941;background:#28180e}#scene img{display:block;width:100%;height:100%;object-fit:contain}.hotspot{position:absolute;transform:translate(-50%,-50%);border:0;background:transparent;cursor:pointer;border-radius:8px;width:8.5%;height:17%}.hotspot.small{width:5.5%;height:10%}.hotspot:focus-visible,.hotspot:hover{outline:4px dashed #fff200;background:#fff20044}.zone{position:absolute;cursor:pointer;border:0;background:transparent}.zone:hover,.zone:focus-visible{outline:4px dashed #ffeb3b;background:#ffdb002c}dialog{border:8px ridge #8e4a23;background:#f6e4b6;color:#241910;max-width:550px;width:92%;box-shadow:12px 14px #160d08;padding:22px}dialog::backdrop{background:#000b}dialog h2{font:900 2rem system-ui,sans-serif;color:#af2617}button{font:inherit}#close{float:right;border:2px solid #241910;background:#bd2719;color:white;padding:7px 12px;cursor:pointer}.list{display:flex;flex-wrap:wrap;gap:7px}.list button{background:#f5c63e;border:2px solid #322319;padding:7px;cursor:pointer}footer{text-align:center;padding:16px}footer button{background:#f5c63e;border:2px solid #322319;padding:9px 15px;cursor:pointer}@media(min-width:1700px){#scene{max-width:1672px;margin:auto}}@media(max-width:950px){header{font-size:13px}}</style></head><body><header><strong>STEP INSIDE THE NEWSAGENT!</strong> Click a comic cover or a department sign. On mobile, swipe sideways to explore the shelves.</header><div id="viewport"><main id="scene"><img src="newsagent.png" alt="Illustrated 1970s British newsagent with The Main Event comics on the back wall, Almost Made It and Mixed Bag on the left, and Honourable Mentions on the right."></main></div><footer><button id="browse">Browse the full comic directory</button></footer><dialog id="panel"><button id="close">CLOSE ✕</button><h2 id="heading"></h2><p id="description"></p><div class="list" id="list"></div></dialog><script>const main=[["The Beano",23,30],["The Dandy",33,30],["The Beezer",42,30],["The Topper",51,30],["Buster",60,30],["Sparky",70,30],["Whizzer and Chips",23,53],["Cor!!",33,53],["Knockout",42,53],["Buzz",51,53],["Shiver and Shake",60,53],["Whoopee!",70,53],["Cracker",23,69],["Monster Fun",33,69],["Krazy",42,69],["Cheeky Weekly",51,69],["Plug",60,69],["Jackpot",70,69]],extra=[["Smash!",6,51],["TV Comic",15,51],["Lion",4,76],["Valiant",9,76],["Scorcher",14,76],["Victor",19,76],["Battle",4,85],["2000 AD",9,85],["Hotspur",14,85],["Hornet",19,85],["Bunty",86,56],["Judy",92,56],["Mandy",97,56],["Misty",86,66],["Twinkle",92,66],["Playhour",97,66],["Jackie",86,77],["Viz",92,77],["Oz",97,77]],directory={"THE MAIN EVENT":["The Beano","The Dandy","The Beezer","The Topper","Sparky","Buzz","Cracker","Plug","Buster","Whizzer and Chips","Cor!!","Knockout","Shiver and Shake","Whoopee!","Monster Fun","Krazy","Cheeky Weekly","Jackpot"],"ALMOST MADE IT!":["Smash!","TV Comic"],"THE MIXED BAG":["Lion","Valiant","Thunder","Jet","Scorcher","Score 'n' Roar","Vulcan","Battle Picture Weekly","Action","2000 AD","Roy of the Rovers","Hornet","Hotspur","Victor","Wizard","Bullet","Look-in","TV Century 21","Countdown","Star Wars Weekly"],"HONOURABLE MENTIONS":["Bunty","Judy","Mandy","Diana","June","Princess Tina","Tammy","Sandie","Pixie","Jinty","Lindy","Misty","Penny","Spellbound","Twinkle","Pippin","Bimbo","Goofy","Hey Diddle Diddle","Bonnie","Toby","See-Saw","Bobo Bunny","Playhour","Jack and Jill","Teddy Bear","Playland","Seven","Esmeralda","Fun-to-Do","Fun-to-Know","Viz","Nasty Tales","Cyclops","Oz","International Times","Jackie","Pink","Oh Boy!","Blue Jeans"]};const scene=document.getElementById('scene'),panel=document.getElementById('panel'),heading=document.getElementById('heading'),description=document.getElementById('description'),list=document.getElementById('list');function show(name,section){heading.textContent=name;description.textContent=section?'Browse the comics in this department. Select a title to explore it.':'This comic is in the archive. Detailed issue records, artists and strips are being researched.';list.replaceChildren();if(section){for(const title of directory[section]){const b=document.createElement('button');b.textContent=title;b.onclick=()=>show(title);list.append(b)}}panel.showModal()}function hotspot(name,x,y,small){const b=document.createElement('button');b.className='hotspot'+(small?' small':'');b.style.left=x+'%';b.style.top=y+'%';b.title=name;b.setAttribute('aria-label','Explore '+name);b.onclick=()=>show(name);scene.append(b)}for(const [n,x,y] of main)hotspot(n,x,y,false);for(const [n,x,y] of extra)hotspot(n,x,y,true);const zones=[['THE MAIN EVENT',33,19,35,9],['ALMOST MADE IT!',3,33,16,10],['THE MIXED BAG',3,62,17,8],['HONOURABLE MENTIONS',85,37,14,12]];for(const [name,x,y,w,h] of zones){const b=document.createElement('button');b.className='zone';Object.assign(b.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});b.title='Browse '+name;b.setAttribute('aria-label','Browse '+name);b.onclick=()=>show(name,true);scene.append(b)}document.getElementById('close').onclick=()=>panel.close();document.getElementById('browse').onclick=()=>{heading.textContent='THE COMPLETE COMIC DIRECTORY';description.textContent='Choose a department.';list.replaceChildren();for(const k of Object.keys(directory)){const b=document.createElement('button');b.textContent=k;b.onclick=()=>show(k,true);list.append(b)}panel.showModal()};</script></body></html>
